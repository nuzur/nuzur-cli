# .github/workflows/release.yml
name: goreleaser

on:
  pull_request:
  push:
    # run only against tags
    tags:
      - "*"

permissions:
  contents: write
  # packages: write
  # issues: write
  # id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # go-version-file, NOT "stable": the release must build with the Go version
      # this module declares, not with whatever is newest on the day it runs.
      #
      # "stable" floated to Go 1.27 and broke the release outright. Under 1.27,
      # golang.org/x/net/http2 swaps server.go (which defines TrailerPrefix) for
      # server_wrap.go (which does not), and google.golang.org/grpc still
      # references http2.TrailerPrefix — so every target fails to compile with
      # "undefined: http2.TrailerPrefix". No grpc or x/net release fixes this
      # yet, so the Go version is the thing to hold still.
      #
      # The test workflow (go.yml) already pinned this way, which is why CI went
      # on passing while the release broke: a floating toolchain in one workflow
      # and a pinned one in the other means the two stop testing the same thing.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # More assembly might be required: Docker logins, GPG, etc.
      # It all depends on your needs.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          # 'latest', 'nightly', or a semver
          version: "~> v2"
          args: release --clean --config .goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GR_GITHUB_TOKEN: ${{ secrets.GR_GITHUB_TOKEN }}